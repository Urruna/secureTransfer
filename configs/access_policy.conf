# ============================================================================
#  SecureTransfer 访问控制策略（角色 / 权限 / 身份映射）
#
#  说明：
#    * 身份认证回答"你是谁"（第二部分已完成），本文件回答"你能做什么"；
#    * 判定在**服务端**（Bob）执行：客户端只做本地提示，不参与决策；
#    * 未登记的身份一律落到 [default] 的 role（默认 guest），
#      并且"角色未定义权限"时按最小权限（无权限）处理 —— 默认拒绝。
#
#  改策略不需要改代码：增加身份只需在 [identity] 里加一行。
#
#  ⚠ 课程演示配置说明
#    为了演示"同一次通信里不同身份权限不同"，这里给三个身份授予不同角色；
#    它们共用同一把 K_master（实验环境），真实系统应每个身份一把独立凭证。
# ============================================================================

[default]
# 未登记的身份使用这个角色（最小权限）
role = guest

[identity]
# 身份 → 角色
alice = admin
bob = admin
eve = user
mallory = guest

[role:admin]
# 管理员：可发消息 / 文件 / 图像，并可查看审计日志、管理用户
permissions = send_message, send_file, send_image, view_log, manage_users

[role:user]
# 普通用户：可发消息 / 文件 / 图像，但不能查看审计日志、不能管理用户
permissions = send_message, send_file, send_image

[role:guest]
# 访客：只允许发短消息（不能发文件 / 图像）
permissions = send_message
