# ============================================================================
#  SecureTransfer 演示参数（第二部分：安全通信协议与网络）
#
#  说明：alice / bob 通过命令行参数接收 host / port，
#        本文件把协议默认值集中记录下来，便于写进实验报告。
#
#  安全提示：密钥不放在这里，见 configs/keys.conf（权限 600）。
# ============================================================================

[network]
# 默认监听地址（Bob 使用；0.0.0.0 可接受局域网连接）
listen_address = 0.0.0.0

# 默认通信端口
port = 9000

# 会话/握手超时（毫秒）
handshake_timeout_ms = 5000
io_timeout_ms = 10000

[protocol]
# 协议版本与数据包布局（见 include/protocol/packet.h）
version = 0x01
magic = "ST"
header_size = 41
mac_size = 16
max_body_size = 1048519

# Nonce 结构：随机前缀(8) || 0x00000000(4) || 消息计数(4)
# 说明见 docs/protocol.md §4
nonce_prefix_size = 8
nonce_counter_size = 4

# 会话密钥（课程 project_q1.md 规定的测试值，必须"分发"而不是本地推导）
session_key = 000102030405060708090a0b0c0d0e0f

# 子密钥派生标签
enc_key_label = "ST-DATA-ENC"
mac_key_label = "ST-DATA-MAC"

[log]
# DEBUG / INFO / WARN / ERROR
# 注意：DEBUG 仅用于开发调试，禁止在日志中输出密钥等敏感数据。
log_level = INFO
